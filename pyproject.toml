[project]
name = "trubeat"
version = "0.1.0"
description = "rPPG-based deepfake detector (FakeCatcher-style rebuild)"
requires-python = ">=3.11,<3.13"  # mediapipe 0.10.21 ships cp312 wheels (verified)
dependencies = [
  "numpy<2.0",            # MediaPipe 0.10.x breaks on NumPy 2 — do not lift
  "opencv-python-headless==4.9.0.80",  # headless: CI-safe, no imshow anywhere
  "mediapipe==0.10.21",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pandas",
  "pyyaml",
  "matplotlib",
]

[project.optional-dependencies]
# Phase 4 / future — not needed for the pipeline or tests
serving = ["fastapi", "uvicorn[standard]", "gradio"]
tracking = ["mlflow", "dvc"]  # local file store / dataset versioning
# "torch",             # Phase 3 — install per https://pytorch.org for your platform
# Reference-harness runtime for third_party/rppg-toolbox cross-checks only
# (NOT a pipeline dependency). Must stay <0.23: scikit-image 0.23+ forces
# numpy>=2, which violates the numpy<2.0 pin above (learned 2026-10-18).
toolbox_ref = ["scikit-image>=0.22,<0.23"]

[project.scripts]
trubeat = "trubeat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trubeat"]
